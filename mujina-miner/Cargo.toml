[package]
name = "mujina-miner"
version = "0.1.0"
edition.workspace = true
description = "Bitcoin mining software"
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "mujina-minerd"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bitcoin = { workspace = true }
bitflags = { workspace = true }
bitvec = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
crc_all = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
inventory = { workspace = true }
nusb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-serial = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
slotmap = { workspace = true }
num-traits = { workspace = true }
ruint = "1.17.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
io-kit-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
udev = { workspace = true }

[[bin]]
name = "mujina-minerd"
path = "src/bin/minerd.rs"

[[bin]]
name = "mujina-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "mujina-tui"
path = "src/bin/tui.rs"

[[bin]]
name = "nonce_probe"
path = "src/bin/nonce_probe.rs"

[[bin]]
name = "rolltime_probe"
path = "src/bin/rolltime_probe.rs"

[[bin]]
name = "freq_spd_probe"
path = "src/bin/freq_spd_probe.rs"

[[bin]]
name = "mode_probe"
path = "src/bin/mode_probe.rs"

[[bin]]
name = "volt_at_freq_probe"
path = "src/bin/volt_at_freq_probe.rs"

[features]
default = []
skip-pty-tests = []  # Skip PTY-based serial tests that may hang in some environments
# Avalon Nano3s board driver (A3197S chain over rtos_core.elf's IPCM
# protocol). Off by default: build.rs links vendor/sdk_libs/libipcmsg.a,
# a riscv64 static archive -- enabling this on a native (non-riscv64)
# build would fail to link. Only pass --features nano3s when
# cross-compiling for riscv64gc-unknown-linux-gnu for the actual device.
nano3s = []

[build-dependencies]
cc = "1"

[dev-dependencies]
http = "1"
http-body-util = "0.1"
serial_test = "3.3.1"
test-case = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
